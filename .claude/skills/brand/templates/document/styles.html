<!--
  Document Styles — Import this in any document template.
  All values reference design tokens from MASTER.md.
  Generate design-tokens.css from MASTER.md before using.
-->
<style>
  /* === Base === */
  :root {
    /* These defaults are overridden by design-tokens.css from MASTER.md */
    --color-primary: #2563EB;
    --color-background: #ffffff;
    --color-surface: #F8FAFC;
    --color-text: #1E293B;
    --color-text-secondary: #64748B;
    --color-border: #E2E8F0;
    --font-heading: 'Inter', sans-serif;
    --font-body: 'Inter', sans-serif;
  }

  body {
    font-family: var(--font-body);
    font-size: 11pt;
    line-height: 1.6;
    color: var(--color-text);
    max-width: 75ch;
  }

  /* === Headings === */
  h1 { font-family: var(--font-heading); font-size: 24pt; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 12px 0; color: var(--color-text); }
  h2 { font-family: var(--font-heading); font-size: 18pt; font-weight: 600; letter-spacing: -0.01em; margin: 32px 0 8px 0; color: var(--color-text); }
  h3 { font-family: var(--font-heading); font-size: 13pt; font-weight: 600; margin: 24px 0 6px 0; color: var(--color-text); }
  h4 { font-family: var(--font-heading); font-size: 11pt; font-weight: 600; margin: 16px 0 4px 0; color: var(--color-text-secondary); text-transform: uppercase; letter-spacing: 0.05em; }

  /* === Body === */
  p { margin: 0 0 12px 0; }
  a { color: var(--color-primary); text-decoration: none; }
  a:hover { text-decoration: underline; }
  strong { font-weight: 600; }
  code { font-family: 'JetBrains Mono', monospace; font-size: 0.9em; background: var(--color-surface); padding: 2px 6px; border-radius: 3px; }

  /* === Lists === */
  ul, ol { margin: 0 0 12px 0; padding-left: 24px; }
  li { margin-bottom: 4px; }

  /* === Tables === */
  table { width: 100%; border-collapse: collapse; margin: 16px 0; font-size: 10pt; }
  th { background: var(--color-surface); font-weight: 600; text-align: left; padding: 10px 14px; border: 1px solid var(--color-border); }
  td { padding: 10px 14px; border: 1px solid var(--color-border); }
  tr:nth-child(even) td { background: var(--color-surface); }

  /* === Callouts === */
  .callout { background: var(--color-surface); border-left: 3px solid var(--color-primary); padding: 16px 20px; margin: 16px 0; border-radius: 0 6px 6px 0; font-size: 10.5pt; }
  .callout-title { font-weight: 600; margin-bottom: 4px; }

  /* === Dividers === */
  hr { border: none; border-top: 1px solid var(--color-border); margin: 24px 0; }

  /* === Blockquote === */
  blockquote { border-left: 3px solid var(--color-border); padding-left: 16px; color: var(--color-text-secondary); font-style: italic; margin: 16px 0; }

  /* === Print === */
  @media print {
    body { font-size: 10pt; }
    a { color: var(--color-text); }
    .no-print { display: none; }
  }
</style>
