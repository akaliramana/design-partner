<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    .slide {
      width: 1920px; height: 1080px;
      background: var(--color-background, #0A0A0B);
      color: var(--color-text, #E8E8ED);
      font-family: var(--font-heading, 'Inter', sans-serif);
      display: flex; flex-direction: column;
      justify-content: center; align-items: flex-start;
      padding: 80px 120px;
      position: relative;
    }
    .logo { position: absolute; top: 60px; left: 120px; display: flex; align-items: center; gap: 10px; }
    .logo-mark { width: 12px; height: 12px; border-radius: 3px; background: var(--color-primary, #7C5CFC); }
    .logo-text { font-size: 18px; font-weight: 600; color: var(--color-text, #E8E8ED); }
    .title { font-size: 72px; font-weight: 700; line-height: 1.1; letter-spacing: -0.03em; max-width: 1200px; margin-bottom: 24px; }
    .subtitle { font-size: 28px; font-weight: 400; color: var(--color-text-secondary, #8B8B96); max-width: 800px; line-height: 1.4; }
    .meta { position: absolute; bottom: 60px; left: 120px; font-size: 16px; color: var(--color-text-secondary, #8B8B96); }
    .accent-line { width: 60px; height: 4px; background: var(--color-primary, #7C5CFC); border-radius: 2px; margin-bottom: 32px; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="logo">
      <div class="logo-mark"></div>
      <span class="logo-text">{{COMPANY_NAME}}</span>
    </div>
    <div class="accent-line"></div>
    <h1 class="title">{{DECK_TITLE}}</h1>
    <p class="subtitle">{{DECK_SUBTITLE}}</p>
    <div class="meta">{{DATE}} · {{EVENT_OR_CONTEXT}}</div>
  </div>
</body>
</html>
