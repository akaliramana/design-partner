<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    .slide {
      width: 1920px; height: 1080px;
      background: var(--color-background, #0A0A0B);
      color: var(--color-text, #E8E8ED);
      font-family: var(--font-body, 'Inter', sans-serif);
      padding: 80px 120px;
      display: flex; flex-direction: column;
      position: relative;
    }
    .headline { font-family: var(--font-heading, 'Inter', sans-serif); font-size: 40px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 48px; }
    .comparison-grid { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
    .comparison-col { background: var(--color-surface, #141417); border-radius: 12px; padding: 40px; }
    .comparison-col.highlight { border: 2px solid var(--color-primary, #7C5CFC); }
    .col-header { font-size: 24px; font-weight: 600; margin-bottom: 24px; }
    .col-header.highlight { color: var(--color-primary, #7C5CFC); }
    .feature-list { list-style: none; padding: 0; }
    .feature-list li { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--color-border, #2A2A30); font-size: 18px; }
    .feature-list li:last-child { border-bottom: none; }
    .check { color: var(--color-primary, #7C5CFC); font-weight: 600; }
    .cross { color: var(--color-text-secondary, #5C5C66); }
    .slide-number { position: absolute; bottom: 40px; right: 60px; font-size: 14px; color: var(--color-text-secondary, #5C5C66); }
  </style>
</head>
<body>
  <div class="slide">
    <h2 class="headline">{{HEADLINE}}</h2>
    <div class="comparison-grid">
      <div class="comparison-col">
        <h3 class="col-header">{{COL_A_TITLE}}</h3>
        <ul class="feature-list">
          <!-- {{COL_A_ITEMS}} -->
          <li><span class="cross">-</span> {{FEATURE}}</li>
        </ul>
      </div>
      <div class="comparison-col highlight">
        <h3 class="col-header highlight">{{COL_B_TITLE}}</h3>
        <ul class="feature-list">
          <!-- {{COL_B_ITEMS}} -->
          <li><span class="check">+</span> {{FEATURE}}</li>
        </ul>
      </div>
    </div>
    <span class="slide-number">{{SLIDE_NUMBER}}</span>
  </div>
</body>
</html>
