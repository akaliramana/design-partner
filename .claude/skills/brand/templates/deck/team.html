<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    .slide {
      width: 1920px; height: 1080px;
      background: var(--color-background, #0A0A0B);
      color: var(--color-text, #E8E8ED);
      font-family: var(--font-body, 'Inter', sans-serif);
      padding: 80px 120px;
      display: flex; flex-direction: column;
      position: relative;
    }
    .headline { font-family: var(--font-heading, 'Inter', sans-serif); font-size: 40px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 48px; }
    .team-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 32px; flex: 1; align-content: center; }
    .member { display: flex; flex-direction: column; align-items: center; text-align: center; }
    .member-avatar { width: 100px; height: 100px; border-radius: 50%; background: var(--color-surface, #141417); border: 2px solid var(--color-border, #2A2A30); display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 600; color: var(--color-primary, #7C5CFC); margin-bottom: 16px; }
    .member-name { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
    .member-role { font-size: 15px; color: var(--color-text-secondary, #8B8B96); margin-bottom: 8px; }
    .member-bio { font-size: 13px; color: var(--color-text-secondary, #5C5C66); max-width: 280px; line-height: 1.4; }
    .slide-number { position: absolute; bottom: 40px; right: 60px; font-size: 14px; color: var(--color-text-secondary, #5C5C66); }
  </style>
</head>
<body>
  <div class="slide">
    <h2 class="headline">{{HEADLINE}}</h2>
    <div class="team-grid">
      <!-- Repeat for each team member -->
      <div class="member">
        <div class="member-avatar">{{INITIALS}}</div>
        <div class="member-name">{{NAME}}</div>
        <div class="member-role">{{ROLE}}</div>
        <div class="member-bio">{{BIO_SNIPPET}}</div>
      </div>
      <!-- /Repeat -->
    </div>
    <span class="slide-number">{{SLIDE_NUMBER}}</span>
  </div>
</body>
</html>
