<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    .slide {
      width: 1920px; height: 1080px;
      background: var(--color-surface, #141417);
      color: var(--color-text, #E8E8ED);
      font-family: var(--font-heading, 'Inter', sans-serif);
      display: flex; flex-direction: column;
      justify-content: center; align-items: flex-start;
      padding: 80px 120px;
    }
    .section-number { font-size: 120px; font-weight: 700; color: var(--color-primary, #7C5CFC); opacity: 0.15; line-height: 1; margin-bottom: -20px; }
    .section-title { font-size: 56px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; }
    .section-subtitle { font-size: 22px; color: var(--color-text-secondary, #8B8B96); margin-top: 16px; max-width: 700px; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="section-number">{{SECTION_NUMBER}}</div>
    <h2 class="section-title">{{SECTION_TITLE}}</h2>
    <p class="section-subtitle">{{SECTION_SUBTITLE}}</p>
  </div>
</body>
</html>
