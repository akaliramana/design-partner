<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    .slide {
      width: 1920px; height: 1080px;
      background: var(--color-background, #0A0A0B);
      color: var(--color-text, #E8E8ED);
      font-family: var(--font-body, 'Inter', sans-serif);
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      padding: 80px 200px;
      text-align: center;
      position: relative;
    }
    .quote-mark { font-size: 120px; color: var(--color-primary, #7C5CFC); opacity: 0.2; line-height: 1; margin-bottom: -30px; font-family: Georgia, serif; }
    .quote { font-size: 36px; font-weight: 500; line-height: 1.5; max-width: 1200px; letter-spacing: -0.01em; margin-bottom: 40px; }
    .attribution { display: flex; align-items: center; gap: 16px; justify-content: center; }
    .avatar { width: 56px; height: 56px; border-radius: 50%; background: var(--color-surface, #141417); display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 600; color: var(--color-primary, #7C5CFC); }
    .attr-text { text-align: left; }
    .attr-name { font-size: 18px; font-weight: 600; }
    .attr-role { font-size: 15px; color: var(--color-text-secondary, #8B8B96); margin-top: 2px; }
    .slide-number { position: absolute; bottom: 40px; right: 60px; font-size: 14px; color: var(--color-text-secondary, #5C5C66); }
  </style>
</head>
<body>
  <div class="slide">
    <div class="quote-mark">"</div>
    <blockquote class="quote">{{QUOTE_TEXT}}</blockquote>
    <div class="attribution">
      <div class="avatar">{{INITIALS}}</div>
      <div class="attr-text">
        <div class="attr-name">{{PERSON_NAME}}</div>
        <div class="attr-role">{{PERSON_ROLE}}, {{COMPANY}}</div>
      </div>
    </div>
    <span class="slide-number">{{SLIDE_NUMBER}}</span>
  </div>
</body>
</html>
