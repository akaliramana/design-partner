<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    .slide {
      width: 1920px; height: 1080px;
      background: var(--color-background, #0A0A0B);
      color: var(--color-text, #E8E8ED);
      font-family: var(--font-body, 'Inter', sans-serif);
      padding: 80px 120px;
      display: flex; flex-direction: column;
      position: relative;
    }
    .headline { font-family: var(--font-heading, 'Inter', sans-serif); font-size: 40px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 8px; }
    .chart-subtitle { font-size: 18px; color: var(--color-text-secondary, #8B8B96); margin-bottom: 40px; }
    .chart-container { flex: 1; display: flex; align-items: center; justify-content: center; }
    .chart-container canvas { max-height: 700px; }
    .source { position: absolute; bottom: 40px; left: 120px; font-size: 14px; color: var(--color-text-secondary, #5C5C66); }
    .slide-number { position: absolute; bottom: 40px; right: 60px; font-size: 14px; color: var(--color-text-secondary, #5C5C66); }
  </style>
</head>
<body>
  <div class="slide">
    <h2 class="headline">{{CHART_TITLE}}</h2>
    <p class="chart-subtitle">{{CHART_SUBTITLE}}</p>
    <div class="chart-container">
      <canvas id="chart" width="1600" height="700"></canvas>
    </div>
    <span class="source">{{SOURCE}}</span>
    <span class="slide-number">{{SLIDE_NUMBER}}</span>
  </div>
  <script>
    // Replace with actual chart config from design-system tokens
    new Chart(document.getElementById('chart'), {
      type: '{{CHART_TYPE}}', // line, bar, doughnut, etc.
      data: {
        labels: [/* {{LABELS}} */],
        datasets: [{
          data: [/* {{DATA}} */],
          borderColor: '{{COLOR_PRIMARY}}',
          backgroundColor: '{{COLOR_PRIMARY}}22',
          fill: true,
          tension: 0.4
        }]
      },
      options: {
        responsive: true,
        plugins: {
          legend: { display: false },
          tooltip: { enabled: true }
        },
        scales: {
          x: { ticks: { color: '#8B8B96' }, grid: { color: '#2A2A3020' } },
          y: { ticks: { color: '#8B8B96' }, grid: { color: '#2A2A3040' } }
        }
      }
    });
  </script>
</body>
</html>
